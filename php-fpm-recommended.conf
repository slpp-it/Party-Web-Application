# PHP-FPM Configuration for Performance Optimization
# Place this in /etc/php/8.2/fpm/pool.d/www.conf (adjust version as needed)

[www]
user = www-data
group = www-data
listen = /var/run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

# Process Manager (PM) Configuration
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 500

# Process Priority
pm.process_idle_timeout = 10s
pm.status_path = /status

# Performance Tuning
request_terminate_timeout = 300
request_slowlog_timeout = 30
slowlog = /var/log/php8.2-fpm-slow.log

# Opcache Configuration (add to php.ini)
# opcache.enable=1
# opcache.memory_consumption=256
# opcache.interned_strings_buffer=16
# opcache.max_accelerated_files=10000
# opcache.revalidate_freq=2
# opcache.fast_shutdown=1
# opcache.enable_cli=0

# Security Limits
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
php_admin_value[open_basedir] = /var/www/html/:/tmp/

# Resource Limits
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[max_file_uploads] = 20

# Session Configuration
php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/php/sessions
php_value[session.gc_maxlifetime] = 1440
php_value[session.cookie_httponly] = On
php_value[session.cookie_secure] = On
php_value[session.use_strict_mode] = On

# Error Handling
php_admin_value[error_log] = /var/log/php8.2-fpm-error.log
php_admin_value[log_errors] = On
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_value[display_errors] = Off
php_value[display_startup_errors] = Off
